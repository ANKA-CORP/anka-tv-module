<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>anka-tv</title>
<style>html, body { margin: 0; height: 100%; background: #160d0b; }</style>
<script>
// TizenBrew loads this page from jsDelivr's @main, which some jsDelivr edges keep serving stale for hours after a
// purge (2026-10-20). So this page stays tiny and rarely changes: it asks GitHub for the newest commit and writes in
// that exact version of main.html, whose scripts and images then load from the same commit.
'use strict';
(function () {
  var REPO = 'ANKA-CORP/anka-tv-module';

  function show(base) {
    return fetch(base + 'main.html').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (html) {
      if (base) html = html.replace('<head>', '<head><base href="' + base + '">');
      document.open();
      document.write(html);
      document.close();
    });
  }

  // On the Mac (tools/dev.sh) main.html sits next to this file.
  if (location.hostname === 'localhost') { show(''); return; }
  fetch('https://api.github.com/repos/' + REPO + '/commits/main', { headers: { 'Accept': 'application/vnd.github.sha' } })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (sha) { return show('https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha.trim() + '/app/'); })
    .catch(function () { return show(''); });
})();
</script>
</head>
<body></body>
</html>
