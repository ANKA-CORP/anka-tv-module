<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>anka-tv</title>
<style>
  body { margin: 0; background: #0b0b0f; color: #eee; font: 28px/1.4 sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
  h1 { font-size: 72px; margin: 0 0 12px; }
  #status { color: #888; }
</style>
</head>
<body>
<div>
  <h1>anka-tv</h1>
  <div id="status">checking the service…</div>
</div>
<script>
  // The module's service (service/service.js) runs on the TV itself; on the Mac, tools/dev.sh starts it.
  var SERVICE = 'http://127.0.0.1:8085';
  var statusEl = document.getElementById('status');

  function log(msg) {
    fetch(SERVICE + '/log', { method: 'POST', body: msg }).catch(function () {});
  }

  fetch(SERVICE + '/top')
    .then(function (r) { return r.text(); })
    .then(function (slug) { statusEl.textContent = 'service ok · most watched now: ' + slug; log('app started, top: ' + slug); })
    .catch(function (e) { statusEl.textContent = 'service unreachable: ' + e; });

  document.addEventListener('keydown', function (e) {
    // Back (10009 on the Samsung remote, Backspace on a keyboard) returns to TizenBrew's menu.
    if (e.keyCode === 10009 || e.keyCode === 8) { history.back(); e.preventDefault(); }
  });
</script>
</body>
</html>
