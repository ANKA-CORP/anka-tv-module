<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>anka-tv</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<!--
  CSS stays inline: TizenBrew's proxy (127.0.0.1:8081) doesn't pass content types, and browsers refuse
  stylesheets without text/css. Classic scripts don't care, so the JavaScript lives in separate files.
  TizenBrew's web view on our TV is Chromium 120, so modern CSS works; the TV's own browser is older.
-->
<style>
  /* A living-room screen read from three metres: big display type for names, a face built for legibility
     for everything else, the phoenix's ember as the accent. Themes come from the dashboard (data-theme). */
  :root {
    --display: "Bricolage Grotesque", "SamsungOne", "Helvetica Neue", Arial, sans-serif;
    --ui: "Atkinson Hyperlegible Next", "SamsungOne", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #160d0b;
    --bg-rgb: 22, 13, 11;
    --card: #261612;
    --text: #f7ece5;
    --muted: #b49b91;
    --accent: #ff8a3d;
    --live: #ff4b4b;
    --focus: #ffd6b8;
    /* Painted backdrop: the phoenix rising on the right, the left half left dark for text. Only Gün batımı has one so far. */
    --backdrop: url(img/bg-sunset.webp);
  }
  :root[data-theme="night"] { --backdrop: none; --bg: #0d0e10; --bg-rgb: 13, 14, 16; --card: #1b1d21; --text: #eef0f2; --muted: #969aa3; --accent: #53fc18; --live: #ff4b4b; --focus: #ffffff; }
  :root[data-theme="ocean"] { --backdrop: none; --bg: #06121e; --bg-rgb: 6, 18, 30; --card: #0f2236; --text: #e8f1f8; --muted: #8aa4bd; --accent: #38d6ff; --focus: #a6ecff; }
  :root[data-theme="lavender"] { --backdrop: none; --bg: #0e0a16; --bg-rgb: 14, 10, 22; --card: #1c1530; --text: #efe9fb; --muted: #a59bbf; --accent: #b18cff; --focus: #e2d4ff; }
  :root[data-theme="oled"] { --backdrop: none; --bg: #000000; --bg-rgb: 0, 0, 0; --card: #111111; --text: #f2f2f2; --muted: #8a8a8a; --accent: #ffffff; --live: #ff3b3b; --focus: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: var(--ui); color: var(--text); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--bg); }

  /* Top bar */
  #topbar { position: absolute; left: 96px; right: 96px; top: 40px; height: 72px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
  #brand { font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
  #brand span { font-weight: 500; color: var(--muted); margin-left: 2px; }
  #version { font-style: normal; font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 14px; }
  #brand { display: flex; align-items: center; }
  #logo { width: 46px; height: 46px; margin-right: 12px; color: var(--accent); }
  #topright { display: flex; align-items: center; }
  #weather { font-size: 24px; color: var(--muted); margin-right: 28px; padding-right: 28px; border-right: 2px solid rgba(255,255,255,.12); text-align: right; line-height: 1.25; }
  #weather b { display: block; font-family: var(--display); font-size: 36px; color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  #weather:empty { display: none; }
  #when { text-align: right; line-height: 1.2; }
  #clock { font-family: var(--display); font-size: 44px; font-weight: 700; letter-spacing: -.5px; color: var(--text); font-variant-numeric: tabular-nums; }
  #date { font-size: 21px; color: var(--muted); }

  /* Hero: the focused stream */
  #hero { position: absolute; left: 0; top: 0; width: 1920px; height: 640px; overflow: hidden; }
  .hero-bg { position: absolute; right: 0; top: 0; width: 1140px; height: 640px; background-size: cover; background-position: center; opacity: 0; transition: opacity .4s ease; will-change: opacity; }
  /* The painting sits under the stream picture, so the hero's fades blend both the same way. */
  #backdrop { position: absolute; right: 0; top: -20px; width: 1260px; height: 704px; background: var(--backdrop) center / cover no-repeat; }
  /* Over a painting an app's colour only tints it. */
  :root:not([data-theme]) .hero-bg.app.on, :root[data-theme="sunset"] .hero-bg.app.on { opacity: .5; }
  .hero-bg.on { opacity: 1; animation: drift 26s ease-in-out infinite alternate; }
  /* The stream picture drifts slowly towards you, like a camera on a crane. */
  @keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.1) translate(-1.5%, 1%); } }
  #hero-fade { position: absolute; left: 0; top: 0; width: 1920px; height: 640px;
    background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, rgba(var(--bg-rgb),.85) 50%, rgba(var(--bg-rgb),0) 75%),
                linear-gradient(0deg, var(--bg) 0%, rgba(var(--bg-rgb),0) 40%),
                linear-gradient(180deg, rgba(var(--bg-rgb),.92) 0%, rgba(var(--bg-rgb),.6) 110px, rgba(var(--bg-rgb),0) 230px),
                radial-gradient(ellipse 700px 380px at 100% 0%, rgba(var(--bg-rgb),.9) 0%, rgba(var(--bg-rgb),0) 100%); }
  #topbar { text-shadow: 0 2px 12px rgba(0,0,0,.55); }
  #hero-info { position: absolute; left: 96px; top: 168px; width: 900px; }
  /* On every focus change the hero's lines arrive one after another. */
  #hero-info.enter > * { animation: arrive .45s cubic-bezier(.2,.8,.2,1) both; }
  #hero-info.enter > :nth-child(2) { animation-delay: .04s; }
  #hero-info.enter > :nth-child(3) { animation-delay: .08s; }
  #hero-info.enter > :nth-child(4) { animation-delay: .12s; }
  @keyframes arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* Embers drifting up through the hero: a handful of composited dots, transform and opacity only. */
  #embers-layer { position: absolute; left: 0; top: 0; width: 1920px; height: 640px; overflow: hidden; pointer-events: none; }
  .ember { position: absolute; bottom: -20px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px 2px var(--accent); opacity: 0; will-change: transform, opacity;
    animation: ember var(--d) linear var(--delay) infinite; }
  @keyframes ember {
    0% { transform: translate(0, 0) scale(1); opacity: 0; }
    10% { opacity: .9; }
    60% { opacity: .55; }
    100% { transform: translate(var(--sway), -700px) scale(.3); opacity: 0; }
  }
  #hero-tags { display: flex; align-items: center; height: 36px; margin-bottom: 18px; font-size: 25px; color: var(--muted); }
  /* State as a dot and a word, the way broadcast TV marks "live"; no badges. */
  .pill { display: inline-flex; align-items: center; font-weight: 700; margin-right: 22px; }
  .pill::before { content: ""; width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; background: currentColor; }
  .pill.live { color: var(--live); }
  .pill.off { color: var(--muted); }
  .pill.app { color: var(--accent); }
  .pill.app::before { display: none; }
  #hero-tags .pill.live::before { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #hero-name { display: flex; align-items: center; font-family: var(--display); font-size: 88px; font-weight: 800; letter-spacing: -2px; line-height: 1; margin-bottom: 22px; }
  #hero-name img { width: 76px; height: 76px; border-radius: 50%; margin-right: 22px; object-fit: cover; background: var(--card); }
  #hero-title { font-size: 32px; line-height: 1.35; color: var(--text); opacity: .86; max-height: 88px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #hero-meta { margin-top: 22px; font-size: 26px; color: var(--muted); }

  /* Rows */
  #rows { position: absolute; left: 0; top: 618px; width: 1920px; height: 1000px; }
  #rows-inner { transition: transform .28s ease-out; will-change: transform; }
  .row { height: 360px; transition: opacity .3s ease; }
  .row.above { opacity: 0; }
  .row-title { padding-left: 96px; height: 54px; font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: -.4px; color: var(--text); }
  .row-title small { font-family: var(--ui); font-size: 22px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 16px; }
  .track { position: relative; height: 280px; white-space: nowrap; transition: transform .22s ease-out; padding-left: 96px; padding-top: 14px; will-change: transform; }

  /* Only transform and opacity animate: the TV's GPU can't keep up with animated shadows. */
  .card { position: relative; display: inline-block; vertical-align: top; width: 384px; height: 216px; margin-right: 32px; border-radius: 8px; overflow: hidden; background: var(--card);
    transition: transform .22s cubic-bezier(.2,1.5,.4,1); }
  .card::after { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border: 4px solid var(--focus); border-radius: 8px; opacity: 0; transition: opacity .12s ease-out; }
  .card img.thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); }
  .card .label { position: absolute; left: 18px; right: 18px; bottom: 14px; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .label small { display: block; font-family: var(--ui); font-size: 19px; font-weight: 500; letter-spacing: 0; color: rgba(255,255,255,.78); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Over a thumbnail the live mark and viewer count sit on a small dark plate to stay legible. */
  .card .pill, .card .viewers { position: absolute; top: 12px; height: 32px; padding: 0 10px; border-radius: 5px; background: rgba(0,0,0,.62); font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; }
  .card .pill { left: 12px; margin: 0; }
  .card .pill::before { width: 10px; height: 10px; margin-right: 7px; }
  .card .viewers { right: 12px; font-variant-numeric: tabular-nums; }
  .card .fav { position: absolute; right: 14px; bottom: 16px; font-size: 24px; color: var(--accent); }
  .card.offline .avatar { position: absolute; left: 50%; top: 34px; width: 96px; height: 96px; margin-left: -48px; border-radius: 50%; object-fit: cover; filter: grayscale(1); opacity: .7; background: #2a2a33; }
  .card.offline .label { color: var(--muted); text-align: center; }
  .card.hint { background: #15151b; border: 2px dashed #34343e; }
  .row-apps { height: 290px; }
  .row-apps .track { height: 210px; }
  .card.app { width: 288px; height: 162px; display: inline-flex; align-items: center; justify-content: center; }
  .card.app.has-icon { flex-direction: column; }
  /* The icons carry the app's name already. */
  .card.app .app-icon { width: 124px; height: 124px; object-fit: cover; border-radius: 18px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .card.app.has-icon .app-name { display: none; }
  .card.app .app-name { font-family: var(--display); font-size: 36px; font-weight: 800; color: #fff; letter-spacing: -.5px; }
  .card.hint .label { white-space: normal; text-align: center; top: 128px; bottom: auto; font-size: 20px; line-height: 1.3; color: var(--muted); font-weight: 600; }
  .card.hint::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 108px; background: url(img/empty-perch.webp) center / contain no-repeat; mix-blend-mode: lighten; }
  .card.focused { transform: scale(1.07); z-index: 2; }
  .card.focused::after { opacity: 1; animation: breathe 2.6s ease-in-out .4s infinite; }
  @keyframes breathe { 50% { opacity: .55; } }
  /* First load: the cards rise into place one after another. */
  .card.arrive { animation: arrive .5s cubic-bezier(.2,.8,.2,1) calc(var(--i) * 45ms + 120ms) both; }
  .skeleton { background: linear-gradient(90deg, #17171d 0%, #22222a 50%, #17171d 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  #empty { position: absolute; left: 96px; top: 680px; font-size: 30px; color: var(--muted); display: none; padding-left: 230px; min-height: 200px; line-height: 1.4;
    background: url(img/empty-ember.webp) left center / auto 200px no-repeat; }

  /* Player */
  #player { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; display: none; z-index: 10; }
  #player.open { display: block; }
  #video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #000; }
  #spinner { position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
    border: 7px solid rgba(255,255,255,.18); border-top-color: var(--accent); animation: spin .9s linear infinite; display: none; }
  #spinner.on { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #player-msg { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 30px; color: #ddd; }
  #osd { position: absolute; left: 0; right: 0; bottom: 0; height: 400px; padding: 0 96px; box-sizing: border-box;
    background: linear-gradient(0deg, rgba(0,0,0,.96) 0%, rgba(0,0,0,.88) 50%, rgba(0,0,0,0) 100%); opacity: 0;
    transform: translateY(60px); transition: opacity .3s ease, transform .4s cubic-bezier(.2,.9,.3,1); }
  #osd.on { opacity: 1; transform: none; }
  #osd-main { position: absolute; left: 96px; right: 520px; bottom: 96px; }
  #osd-name { display: flex; align-items: center; font-family: var(--display); font-size: 54px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
  #osd-name img { width: 64px; height: 64px; border-radius: 50%; margin-right: 18px; object-fit: cover; background: var(--card); }
  #osd-name .pill { margin-left: 24px; margin-right: 0; font-family: var(--ui); font-size: 26px; letter-spacing: 0; }
  #osd-title { font-size: 28px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #osd-meta { margin-top: 10px; font-size: 24px; color: var(--muted); }
  #osd-side { position: absolute; right: 96px; bottom: 96px; text-align: right; }
  #osd-quality { display: inline-block; font-size: 26px; font-weight: 700; padding: 8px 16px; border-radius: 10px; background: rgba(255,255,255,.12); }
  #osd-hints { position: absolute; left: 96px; right: 96px; bottom: 34px; font-size: 21px; color: #a9a9b3; }
  #osd-hints b { display: inline-block; min-width: 30px; padding: 1px 8px; margin-right: 8px; border-radius: 6px; background: rgba(255,255,255,.14); color: #fff; text-align: center; font-weight: 700; }
  #osd-hints span { margin-right: 36px; }
  /* Quality side panel, Android TV style */
  #qpanel { position: absolute; right: 0; top: 0; width: 560px; height: 1080px; box-sizing: border-box; padding: 120px 48px 0;
    background: rgba(16,16,22,.97); box-shadow: -20px 0 60px rgba(0,0,0,.5); transform: translateX(620px); transition: transform .22s ease-out; will-change: transform; }
  #qpanel.on { transform: translateX(0); }
  #qpanel h2 { margin: 0 0 8px; font-family: var(--display); font-size: 46px; font-weight: 800; letter-spacing: -.8px; }
  #qpanel p { margin: 0 0 36px; font-size: 22px; color: var(--muted); }
  .qitem { position: relative; height: 84px; padding: 0 28px; margin-bottom: 8px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; }
  .qitem b { font-size: 30px; font-weight: 700; }
  .qitem small { font-size: 20px; color: var(--muted); margin-top: 2px; }
  .qitem .check { position: absolute; right: 28px; top: 50%; margin-top: -18px; font-size: 30px; color: var(--accent); }
  .qitem.focused { background: #fff; color: #0b0b0f; }
  .qitem.focused small { color: #55555f; }
  .qitem.focused .check { color: #0b0b0f; }
  #channel-flash { position: absolute; right: 96px; top: 70px; font-size: 30px; font-weight: 700; padding: 12px 22px; border-radius: 12px; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .2s ease; }
  #channel-flash.on { opacity: 1; }

  /* Toasts */
  #toasts { position: absolute; right: 64px; top: 120px; width: 560px; z-index: 20; }
  /* The phoenix mark in the toast's colour (accent, amber for warnings, red for errors), glowing from its corner. */
  .toast { --tone: var(--accent); position: relative; margin-bottom: 14px; padding: 22px 28px 22px 92px; min-height: 50px; border-radius: 12px;
    display: flex; flex-direction: column; justify-content: center;
    background: radial-gradient(ellipse 260px 140px at 0% 0%, color-mix(in srgb, var(--tone) 22%, transparent), transparent), var(--card);
    box-shadow: 0 18px 44px rgba(0,0,0,.5), inset 0 0 0 1px color-mix(in srgb, var(--tone) 30%, transparent);
    font-size: 26px; line-height: 1.35; transform: translateX(620px); transition: transform .35s cubic-bezier(.2,1.3,.4,1), opacity .35s ease; }

  .toast.in { transform: translateX(0); }
  .toast.out { opacity: 0; }
  .toast.warn { --tone: #ffb020; }
  .toast.error { --tone: var(--live); }
  .toast.live { --tone: var(--live); }
  .toast.has-avatar::before { display: none; }
  .toast-avatar { position: absolute; left: 20px; top: 50%; width: 54px; height: 54px; margin-top: -27px; border-radius: 50%; object-fit: cover;
    background: var(--card); box-shadow: 0 0 0 3px var(--tone), 0 0 18px var(--tone); }
  .toast.live .toast-avatar { animation: boss-ring 1.6s ease-in-out infinite; }
  .toast.app .toast-avatar { border-radius: 12px; background: #fff; box-shadow: 0 0 0 2px var(--tone); }
  .toast small { display: block; font-size: 20px; color: var(--muted); margin-bottom: 4px; }
  /* Boss alert: drops in at the top with a fiery edge, shakes, a shine sweeps across it and the screen's edges flash.
     Transform and opacity only, so the TV keeps up. */
  #boss { position: absolute; left: 50%; top: 48px; width: 1240px; margin-left: -620px; z-index: 25; box-sizing: border-box;
    display: flex; align-items: center; padding: 30px 44px; border-radius: 22px; overflow: hidden;
    background: radial-gradient(ellipse 760px 280px at 22% 0%, rgba(255,96,40,.34), transparent), linear-gradient(180deg, #2b120b, #150a07);
    box-shadow: 0 30px 90px rgba(0,0,0,.75), inset 0 0 0 2px rgba(255,138,61,.6), inset 0 0 70px rgba(255,80,30,.22);
    opacity: 0; transform: translateY(-130%); transition: opacity .5s ease, transform .5s ease; }
  #boss.on { opacity: 1; transform: none; animation: boss-in .7s cubic-bezier(.2,1.4,.4,1) both, boss-shake .45s .75s ease-in-out 2; }
  @keyframes boss-in { from { opacity: 0; transform: translateY(-120%) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes boss-shake { 25% { transform: translateX(-9px) rotate(-.5deg); } 75% { transform: translateX(9px) rotate(.5deg); } }
  #boss::before { content: ""; position: absolute; top: -20px; bottom: -20px; left: -320px; width: 260px; transform: skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,210,170,0), rgba(255,210,170,.2), rgba(255,210,170,0)); }
  #boss.on::before { animation: boss-shine 2.2s .7s ease-in-out 3; }
  @keyframes boss-shine { to { transform: translateX(1900px) skewX(-20deg); } }
  #boss-when { flex: none; width: 440px; }
  #boss-kicker { font-family: var(--display); font-size: 32px; font-weight: 700; color: #ff8a3d; white-space: nowrap; }
  #boss-kicker em { font-style: normal; font-weight: 500; color: #b49b91; }
  #boss-left { font-family: var(--display); font-size: 104px; font-weight: 800; line-height: 1; letter-spacing: -3px; color: #f7ece5; font-variant-numeric: tabular-nums; margin: 6px 0 8px; }
  #boss-at { font-size: 26px; color: #b49b91; }
  #boss-at b { color: #f7ece5; font-family: var(--display); font-weight: 700; }
  #boss-list { flex: 1; display: flex; justify-content: flex-end; }
  .boss-item { display: flex; flex-direction: column; align-items: center; margin-left: 40px; animation: arrive .5s cubic-bezier(.2,.8,.2,1) calc(.35s + var(--i) * .12s) both; }
  .boss-item img { position: relative; width: 136px; height: 136px; border-radius: 50%; object-fit: cover; background: #241008;
    box-shadow: 0 0 0 4px #ff8a3d, 0 0 34px 6px rgba(255,100,40,.55); }
  #boss.on .boss-item img { animation: boss-ring 1.6s ease-in-out infinite; }
  @keyframes boss-ring { 50% { transform: scale(1.06); } }
  .boss-item span { margin-top: 16px; font-family: var(--display); font-size: 32px; font-weight: 700; color: #f7ece5; white-space: nowrap; }
  /* Three or four bosses: a wider card, smaller portraits, names may wrap. */
  #boss.many { width: 1600px; margin-left: -800px; }
  #boss.many .boss-item { width: 180px; margin-left: 24px; }
  #boss.many .boss-item img { width: 112px; height: 112px; }
  #boss.many .boss-item span { font-size: 26px; white-space: normal; text-align: center; line-height: 1.15; }
  #boss-flash { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 24; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 160px 40px rgba(255,50,20,.75); }
  #boss.on + #boss-flash { animation: boss-flash 1.1s ease-in-out .3s 3; }
  @keyframes boss-flash { 50% { opacity: 1; } }

  /* Opening: the mark rises over drifting embers (splash.js), then the home screen fades in under it. */
  #splash { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 30; background: var(--bg); transition: opacity .6s ease; }
  #splash.done { opacity: 0; }
  #embers { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #splash-mark { position: absolute; left: 0; right: 0; top: 360px; display: flex; flex-direction: column; align-items: center; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
  #splash-logo { width: 240px; height: 240px; color: var(--accent); }
  #splash-backdrop { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--backdrop) right center / cover no-repeat; animation: dawn 1.6s ease-out both; }
  @keyframes dawn { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
  :root:not([data-theme]) #splash-mark, :root[data-theme="sunset"] #splash-mark { right: auto; left: 200px; top: 330px; align-items: flex-start; }
  #splash-word { font-family: var(--display); font-size: 72px; font-weight: 800; letter-spacing: -2px; margin-top: 10px; }
  #splash-word span { font-weight: 500; color: var(--muted); margin-left: 4px; }
  @keyframes rise { from { opacity: 0; transform: translateY(48px) scale(.94); } to { opacity: 1; transform: none; } }
  /* "Sade" motion (dashboard setting) or the system's reduced motion: everything holds still. */
  :root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after { animation: none !important; }
  :root[data-motion="reduced"] #embers-layer { display: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } #embers-layer { display: none; } }
</style>
